<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>도서 표지 OCR 테스트</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root{
      --bg:#f7f7f5; --card:#fff; --text:#222; --muted:#707070; --line:#e6e6e2;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:760px;margin:0 auto;padding:24px 16px 48px}
    h1{font-size:28px;margin:0 0 8px}
    .sub{color:var(--muted);font-size:15px;line-height:1.5;margin-bottom:20px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
    .drop{border:2px dashed #cfcfc9;border-radius:16px;padding:18px;text-align:center;background:#fafaf8}
    input[type=file]{width:100%;font-size:16px}
    img{max-width:100%;display:none;margin:14px auto 0;border-radius:12px}
    button{border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:700;cursor:pointer}
    .primary{width:100%;background:#222;color:#fff;margin-top:14px}
    .primary:disabled{opacity:.45;cursor:not-allowed}
    .status{margin-top:12px;font-size:14px;color:var(--muted);white-space:pre-wrap}
    .progress{height:8px;background:#ecece8;border-radius:999px;overflow:hidden;margin-top:12px;display:none}
    .bar{height:100%;width:0;background:#222;transition:width .2s}
    label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
    input[type=text], textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;background:#fff}
    textarea{min-height:140px;resize:vertical}
    .grid{display:grid;grid-template-columns:1fr;gap:10px}
    .hint{font-size:13px;color:var(--muted);line-height:1.5}
    .ok{color:#166534}
    .warn{color:#92400e}
  </style>
</head>
<body>
<div class="wrap">
  <h1>📚 도서 표지 OCR 테스트</h1>
  <div class="sub">책 표지 한 장에서 제목·저자·출판사 후보를 추출하는 테스트용 페이지입니다. ISBN과 출간일은 사용하지 않습니다.</div>

  <div class="card">
    <div class="drop">
      <input id="file" type="file" accept="image/*" capture="environment" />
      <img id="preview" alt="표지 미리보기" />
      <div id="fileStatus" class="status">사진을 선택하거나 촬영해주세요.</div>
    </div>
    <button id="run" class="primary" disabled>표지 인식 시작</button>
    <div id="progress" class="progress"><div id="bar" class="bar"></div></div>
    <div id="ocrStatus" class="status"></div>
  </div>

  <div class="card">
    <div class="grid">
      <div>
        <label>제목 후보</label>
        <input id="title" type="text" placeholder="제목 후보가 여기에 표시됩니다" />
      </div>
      <div>
        <label>저자 후보</label>
        <input id="author" type="text" placeholder="저자 후보가 여기에 표시됩니다" />
      </div>
      <div>
        <label>출판사 후보</label>
        <input id="publisher" type="text" placeholder="출판사 후보가 여기에 표시됩니다" />
      </div>
    </div>
    <p class="hint">프로토타입이라 후보 추출은 단순 규칙 기반입니다. OCR 원문과 비교해 잘못 잡히는 패턴을 확인하는 것이 목적입니다.</p>
  </div>

  <div class="card">
    <label>OCR 전체 텍스트</label>
    <textarea id="raw" placeholder="인식된 전체 텍스트가 표시됩니다."></textarea>
  </div>
</div>

<script>
const file = document.getElementById('file');
const preview = document.getElementById('preview');
const run = document.getElementById('run');
const fileStatus = document.getElementById('fileStatus');
const ocrStatus = document.getElementById('ocrStatus');
const progress = document.getElementById('progress');
const bar = document.getElementById('bar');
const raw = document.getElementById('raw');
const title = document.getElementById('title');
const author = document.getElementById('author');
const publisher = document.getElementById('publisher');

let selectedFile = null;

file.addEventListener('change', async () => {
  const f = file.files && file.files[0];
  if (!f) return;
  selectedFile = f;
  run.disabled = false;
  fileStatus.textContent = `✅ 선택됨: ${f.name} · ${(f.size/1024/1024).toFixed(2)}MB`;
  try {
    const url = URL.createObjectURL(f);
    preview.src = url;
    preview.style.display = 'block';
  } catch (e) {
    fileStatus.textContent += '\n⚠️ 미리보기를 표시하지 못했지만 OCR은 시도할 수 있습니다.';
  }
});

function cleanLines(text){
  return text
    .split(/\n+/)
    .map(s => s.replace(/\s+/g,' ').trim())
    .filter(Boolean)
    .filter(s => s.length >= 2);
}

function guessFields(text){
  const lines = cleanLines(text);

  const junk = /(ISBN|정가|가격|원$|www\.|http|펴낸이|기획|편집|디자인|인쇄|발행일)/i;
  const authorHint = /(지음|저자|글\s*$|글쓴이|옮김|번역|著|by\s)/i;
  const publisherHint = /(출판사|펴낸곳|발행처|publisher)/i;

  let authorLine = lines.find(l => authorHint.test(l)) || '';
  let publisherLine = lines.find(l => publisherHint.test(l)) || '';

  let candidates = lines
    .filter(l => !junk.test(l))
    .filter(l => l.length <= 40);

  // 제목은 짧고 눈에 띄는 줄을 우선. 표지 OCR에서는 대개 상위 몇 줄이 핵심.
  let titleLine = candidates
    .filter(l => !authorHint.test(l) && !publisherHint.test(l))
    .sort((a,b) => {
      const aHangul = (a.match(/[가-힣A-Za-z0-9]/g)||[]).length;
      const bHangul = (b.match(/[가-힣A-Za-z0-9]/g)||[]).length;
      return bHangul - aHangul;
    })[0] || '';

  if (authorLine) {
    authorLine = authorLine
      .replace(/(지음|저자|글쓴이|옮김|번역|著|by)/ig,' ')
      .replace(/\s+/g,' ')
      .trim();
  }

  if (publisherLine) {
    publisherLine = publisherLine
      .replace(/(출판사|펴낸곳|발행처|publisher)/ig,' ')
      .replace(/[:：]/g,' ')
      .replace(/\s+/g,' ')
      .trim();
  }

  // 저자 힌트가 없으면 제목 후보 다음의 비교적 짧은 줄을 임시 후보로 사용
  if (!authorLine) {
    authorLine = candidates.find(l => l !== titleLine && l.length <= 16) || '';
  }

  title.value = titleLine;
  author.value = authorLine;
  publisher.value = publisherLine;
}

run.addEventListener('click', async () => {
  if (!selectedFile) return;

  run.disabled = true;
  progress.style.display = 'block';
  bar.style.width = '2%';
  ocrStatus.textContent = 'OCR 엔진을 준비하는 중입니다...';

  try {
    const worker = await Tesseract.createWorker(['kor','eng'], 1, {
      logger: m => {
        if (typeof m.progress === 'number') {
          const pct = Math.max(2, Math.round(m.progress * 100));
          bar.style.width = pct + '%';
          ocrStatus.textContent = `${m.status || '처리 중'} · ${pct}%`;
        } else if (m.status) {
          ocrStatus.textContent = m.status;
        }
      }
    });

    await worker.setParameters({
      preserve_interword_spaces: '1',
      tessedit_pageseg_mode: '6'
    });

    const { data } = await worker.recognize(selectedFile);
    await worker.terminate();

    raw.value = data.text || '';
    guessFields(data.text || '');
    bar.style.width = '100%';
    ocrStatus.innerHTML = '<span class="ok">✅ 인식이 완료되었습니다. 아래 후보와 OCR 원문을 확인해주세요.</span>';
  } catch (err) {
    console.error(err);
    ocrStatus.innerHTML = '<span class="warn">⚠️ OCR 실행에 실패했습니다. Safari에서 인터넷 연결 상태를 확인하고 다시 시도해주세요.</span>';
  } finally {
    run.disabled = false;
  }
});
</script>
</body>
</html>
