<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>책 등록</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Pretendard:wght@400;500;600&display=swap');

  :root{
    --ink:#1c2b3a;
    --ink-soft:#3d4f61;
    --paper:#f3ede0;
    --paper-deep:#e7ddc8;
    --spine:#7a3b2e;
    --leaf:#4a6741;
    --line:#c9bd9e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Pretendard',-apple-system,sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
  }
  /* 상단: 책등(spine) 모티프 */
  header{
    background:var(--ink);
    padding:28px 20px 22px;
    position:relative;
    overflow:hidden;
  }
  header::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:10px;
    background:linear-gradient(180deg,var(--spine),#5a2a20);
  }
  header h1{
    font-family:'Noto Serif KR',serif;
    font-weight:700;
    font-size:22px;
    color:var(--paper);
    margin:0 0 4px 14px;
    letter-spacing:-0.02em;
  }
  header p{
    margin:0 0 0 14px;
    color:#a9b6c2;
    font-size:13px;
  }

  .search-wrap{
    padding:18px 18px 0;
    max-width:640px;
    margin:0 auto;
  }
  form{
    display:flex;
    gap:8px;
    margin-top:-24px;
    position:relative;
    z-index:2;
  }
  input[type="text"]{
    flex:1;
    padding:14px 16px;
    font-size:16px;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--paper);
    box-shadow:0 4px 14px rgba(28,43,58,0.15);
    font-family:'Pretendard',sans-serif;
    color:var(--ink);
  }
  input[type="text"]:focus{
    outline:2px solid var(--leaf);
    outline-offset:1px;
  }
  button.search-btn{
    padding:0 20px;
    border:none;
    border-radius:4px;
    background:var(--spine);
    color:var(--paper);
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(28,43,58,0.15);
  }
  button.search-btn:active{transform:translateY(1px);}

  .status{
    max-width:640px;
    margin:0 auto;
    padding:14px 18px 0;
    font-size:13px;
    color:var(--ink-soft);
    min-height:20px;
  }

  .results{
    max-width:640px;
    margin:0 auto;
    padding:10px 18px 40px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .card{
    display:flex;
    gap:12px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px;
    cursor:pointer;
    transition:box-shadow .15s ease, border-color .15s ease;
  }
  .card:active{background:var(--paper-deep);}
  .card.selected{
    border-color:var(--leaf);
    box-shadow:0 0 0 2px var(--leaf) inset;
  }
  .cover{
    width:52px;
    height:76px;
    flex:none;
    background:var(--paper-deep) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="52" height="76"><rect width="52" height="76" fill="%23e7ddc8"/></svg>') center/cover;
    border-radius:2px;
    border:1px solid var(--line);
    object-fit:cover;
  }
  .meta{
    flex:1;
    min-width:0;
  }
  .meta .title{
    font-family:'Noto Serif KR',serif;
    font-weight:600;
    font-size:15px;
    line-height:1.35;
    margin:0 0 4px;
    color:var(--ink);
  }
  .meta .authors{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .meta .sub{
    font-size:12px;
    color:#7a8a97;
    margin:0;
  }

  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
    font-size:14px;
  }

  /* 선택 결과 패널 */
  .panel{
    max-width:640px;
    margin:0 auto 30px;
    padding:0 18px;
    display:none;
  }
  .panel.show{display:block;}
  .panel-inner{
    background:var(--ink);
    color:var(--paper);
    border-radius:8px;
    padding:18px 18px 16px;
  }
  .panel-inner h2{
    font-family:'Noto Serif KR',serif;
    font-size:14px;
    font-weight:600;
    margin:0 0 10px;
    color:#a9b6c2;
    letter-spacing:0.02em;
  }
  .field-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:7px 0;
    border-bottom:1px solid rgba(255,255,255,0.1);
    font-size:13.5px;
  }
  .field-row:last-of-type{border-bottom:none;}
  .field-row .k{color:#8fa0ad; flex:none; width:64px;}
  .field-row .v{color:var(--paper); text-align:right; flex:1;}
  .copy-btn{
    width:100%;
    margin-top:14px;
    padding:12px;
    border:none;
    border-radius:5px;
    background:var(--leaf);
    color:var(--paper);
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
  }
  .copy-btn:active{opacity:0.85;}
  .copy-btn.copied{background:#37533a;}
  .hint{
    font-size:11.5px;
    color:#7f8fa0;
    text-align:center;
    margin-top:8px;
  }
</style>
</head>
<body>

<header>
  <h1>책 등록</h1>
  <p>제목이나 저자로 검색하고, 결과에서 책을 선택하세요</p>
</header>

<div class="search-wrap">
  <form id="searchForm">
    <input type="text" id="query" placeholder="예: 소년이 온다" autocomplete="off" />
    <button type="submit" class="search-btn">검색</button>
  </form>
</div>

<div class="status" id="status"></div>
<div class="results" id="results"></div>

<div class="panel" id="panel">
  <div class="panel-inner">
    <h2>선택한 책</h2>
    <div class="field-row"><span class="k">제목</span><span class="v" id="p-title"></span></div>
    <div class="field-row"><span class="k">저자</span><span class="v" id="p-authors"></span></div>
    <div class="field-row"><span class="k">출판사</span><span class="v" id="p-publisher"></span></div>
    <div class="field-row"><span class="k">출간일</span><span class="v" id="p-date"></span></div>
    <div class="field-row"><span class="k">ISBN</span><span class="v" id="p-isbn"></span></div>
    <button class="copy-btn" id="copyBtn">노션에 붙여넣을 정보 복사하기</button>
    <p class="hint">복사 후 노션 책 등록 데이터베이스 항목에 붙여넣으세요</p>
  </div>
</div>

<script>
const form = document.getElementById('searchForm');
const input = document.getElementById('query');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');
const panel = document.getElementById('panel');
const copyBtn = document.getElementById('copyBtn');

let selectedBook = null;

form.addEventListener('submit', function(e){
  e.preventDefault();
  const q = input.value.trim();
  if(!q) return;
  search(q);
});

async function search(query){
  statusEl.textContent = '검색 중...';
  resultsEl.innerHTML = '';
  panel.classList.remove('show');
  selectedBook = null;

  try{
    // Google Books API - 별도 키 없이 호출 가능한 공개 검색 엔드포인트
    const url = 'https://www.googleapis.com/books/v1/volumes?q=' + encodeURIComponent(query) + '&maxResults=20&country=KR';
    const res = await fetch(url);
    if(!res.ok) throw new Error('요청 실패');
    const data = await res.json();

    if(!data.items || data.items.length === 0){
      statusEl.textContent = '';
      resultsEl.innerHTML = '<div class="empty">검색 결과가 없습니다.<br>다른 검색어로 시도해보세요.</div>';
      return;
    }

    statusEl.textContent = data.items.length + '건의 결과';
    renderResults(data.items);

  }catch(err){
    statusEl.textContent = '';
    resultsEl.innerHTML = '<div class="empty">검색 중 문제가 발생했습니다.<br>네트워크를 확인하고 다시 시도해주세요.</div>';
  }
}

function renderResults(items){
  resultsEl.innerHTML = '';
  items.forEach(function(item, idx){
    const info = item.volumeInfo || {};
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.idx = idx;

    const coverUrl = info.imageLinks ? (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail) : '';
    const coverImg = coverUrl ? coverUrl.replace('http://','https://') : '';

    const authors = info.authors ? info.authors.join(', ') : '저자 정보 없음';
    const sub = [info.publisher, (info.publishedDate || '').slice(0,4)].filter(Boolean).join(' · ');

    card.innerHTML =
      '<img class="cover" src="' + coverImg + '" onerror="this.style.background=\'var(--paper-deep)\'; this.src=\'\';" />' +
      '<div class="meta">' +
        '<p class="title">' + escapeHtml(info.title || '제목 없음') + '</p>' +
        '<p class="authors">' + escapeHtml(authors) + '</p>' +
        '<p class="sub">' + escapeHtml(sub) + '</p>' +
      '</div>';

    card.addEventListener('click', function(){
      document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectBook(item);
    });

    resultsEl.appendChild(card);
  });
}

function selectBook(item){
  const info = item.volumeInfo || {};
  selectedBook = {
    title: info.title || '',
    authors: info.authors ? info.authors.join(', ') : '',
    publisher: info.publisher || '',
    date: info.publishedDate || '',
    isbn: getIsbn(info),
    cover: info.imageLinks ? (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail || '').replace('http://','https://') : ''
  };

  document.getElementById('p-title').textContent = selectedBook.title || '-';
  document.getElementById('p-authors').textContent = selectedBook.authors || '-';
  document.getElementById('p-publisher').textContent = selectedBook.publisher || '-';
  document.getElementById('p-date').textContent = selectedBook.date || '-';
  document.getElementById('p-isbn').textContent = selectedBook.isbn || '-';

  panel.classList.add('show');
  copyBtn.classList.remove('copied');
  copyBtn.textContent = '노션에 붙여넣을 정보 복사하기';
  panel.scrollIntoView({behavior:'smooth', block:'start'});
}

function getIsbn(info){
  if(!info.industryIdentifiers) return '';
  const isbn13 = info.industryIdentifiers.find(x => x.type === 'ISBN_13');
  const isbn10 = info.industryIdentifiers.find(x => x.type === 'ISBN_10');
  return (isbn13 || isbn10 || {}).identifier || '';
}

copyBtn.addEventListener('click', async function(){
  if(!selectedBook) return;
  const text =
    '제목: ' + selectedBook.title + '\n' +
    '저자: ' + selectedBook.authors + '\n' +
    '출판사: ' + selectedBook.publisher + '\n' +
    '출간일: ' + selectedBook.date + '\n' +
    'ISBN: ' + selectedBook.isbn + '\n' +
    '표지: ' + selectedBook.cover;

  try{
    await navigator.clipboard.writeText(text);
    copyBtn.classList.add('copied');
    copyBtn.textContent = '복사 완료! 노션에 붙여넣으세요';
    setTimeout(function(){
      copyBtn.classList.remove('copied');
      copyBtn.textContent = '노션에 붙여넣을 정보 복사하기';
    }, 2500);
  }catch(err){
    // 클립보드 API 미지원 환경 대비 폴백
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    copyBtn.textContent = '복사 완료! 노션에 붙여넣으세요';
  }
});

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>

</body>
</html>
